# Optional: a backup Pi-hole on the control-plane box, reachable ONLY over the tailnet.
# Installed in place on the running instance (NOT via user data, so no instance replacement):
#   see extras/backup-pihole/README.md
# Port 53 is never opened in the Lightsail firewall; Pi-hole binds only 127.0.0.1 and the
# box's own tailnet IP, so it cannot become an open resolver.
name: extras

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: ts-client
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["/var/lib/ts-client:/var/lib/tailscale"]
    env_file: [/opt/extras/ts.env]   # TS_AUTHKEY for first login only; emptied afterwards
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"          # this box keeps systemd-resolved; it serves DNS, it doesn't consume it
      TS_HOSTNAME: cloud-dns
      TS_EXTRA_ARGS: "--login-server=https://${HS_DOMAIN}"
    restart: unless-stopped

  pihole:
    image: pihole/pihole:2026.10.1
    container_name: pihole
    hostname: pihole-cloud
    network_mode: host
    depends_on: [tailscale]
    mem_limit: 256m
    environment:
      TZ: UTC
      WEBPASSWORD_FILE: pihole_web_password         # read from /run/secrets (docker-secret style)
      FTLCONF_webserver_port: "127.0.0.1:8081"     # admin UI via `ssh -L 8081:127.0.0.1:8081`
      FTLCONF_dns_listeningMode: NONE              # the listen-address list below is the whole policy
      FTLCONF_misc_dnsmasq_lines: "listen-address=127.0.0.1,${TAILNET_IP};bind-dynamic"
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
      FTLCONF_dhcp_active: "false"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"
    volumes:
      - /var/lib/pihole:/etc/pihole
      - /opt/extras/secrets:/run/secrets:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
