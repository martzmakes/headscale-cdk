# Headscale {{HEADSCALE_VERSION}} config, rendered by CDK into /opt/headscale/config/config.yaml.
# Based on https://github.com/juanfont/headscale/blob/{{HEADSCALE_VERSION}}/config-example.yaml
# __PUBLIC_IPV4__ is substituted on the box by hs-bootstrap.sh (static IP isn't
# known when user data is built; the instance and static IP would form a cycle).
#
# Headplane edits this file in place (DNS settings etc.); expect it to drift from
# the template after first boot. Comments may be lost when Headplane rewrites it.

server_url: https://{{DOMAIN}}
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

# Caddy's Docker network: honour its X-Real-IP / True-Client-IP so logs show real client IPs.
trusted_proxies:
  - 10.250.0.0/24

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "headscale"
    region_name: "Headscale Embedded DERP"
    verify_clients: true
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: __PUBLIC_IPV4__
  # Keep Tailscale's public DERP map as a fallback.
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false

node:
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  debug: false
  gorm:
    prepare_stmt: true
    parameterized_queries: true
    skip_err_record_not_found: true
    slow_threshold: 1000
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true
    wal_autocheckpoint: 1000

# TLS is terminated by Caddy.
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

# Policy lives in the database so Headplane can edit ACLs from the UI.
policy:
  mode: database

dns:
  magic_dns: true
  base_domain: {{MAGIC_DNS_BASE_DOMAIN}}
  override_local_dns: true
  nameservers:
    global:
{{NAMESERVERS_YAML}}
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

oidc:
  only_start_if_oidc_is_available: true
  issuer: "{{OIDC_ISSUER}}"
  client_id: "{{OIDC_CLIENT_ID}}"
  # Written by scripts/bootstrap-secret.sh; never in user data or this template.
  client_secret_path: "/run/secrets/oidc_client_secret"
  scope: ["openid", "profile", "email"]
  # allowed_users matches on email, which Headscale only trusts when verified.
  # Create Cognito users with email_verified=true (see README).
  email_verified_required: true
  allowed_users:
{{ALLOWED_USERS_YAML}}
  pkce:
    enabled: true
    method: S256

logtail:
  enabled: false

taildrop:
  enabled: true
